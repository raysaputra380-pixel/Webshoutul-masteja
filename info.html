<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info & Chat - Shoutul Masteja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #FFD700;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #FFD700;
            background: #1e1e1e;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .mine {
            align-self: flex-end;
            background: #FFD700;
            color: #121212;
        }
        .others {
            align-self: flex-start;
            background: #333;
            color: #fff;
            border: 1px solid #FFD700;
        }
        .user-name {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        button {
            background: #FFD700;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
        }
        #chat-form {
            display: flex;
            padding: 15px;
            background: #1e1e1e;
            gap: 10px;
        }
        #msg-input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #FFD700;
            background: #222;
            color: #fff;
        }
    </style>
</head>
<body>

<header>
    <h3><i class="fas fa-info-circle"></i> RUANG OBROLAN</h3>
</header>

<div id="login-overlay">
    <i class="fas fa-comments" style="font-size: 4rem; margin-bottom: 20px;"></i>
    <p style="margin-bottom: 20px;">Silakan login untuk bergabung</p>
    <button onclick="loginGoogle()">Login dengan Google</button>
</div>

<div id="chat-container"></div>

<form id="chat-form">
    <input type="text" id="msg-input" placeholder="Tulis pesan..." autocomplete="off">
    <button type="submit"><i class="fas fa-paper-plane"></i></button>
</form>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // MASUKKAN DATA KONFIGURASI ANDA DI SINI
    const firebaseConfig = {
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAz1nOc9jrQHtG3lrY-A1oEOGfpGwmsK7g",
  authDomain: "shoutulmastejachat.firebaseapp.com",
  projectId: "shoutulmastejachat",
  storageBucket: "shoutulmastejachat.firebasestorage.app",
  messagingSenderId: "40109384180",
  appId: "1:40109384180:web:791ca0d9a012e3288699a1",
  measurementId: "G-QGQLC2BJBZ"    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();
    const provider = new GoogleAuthProvider();

    // Fungsi Login
    window.loginGoogle = () => {
        signInWithRedirect(auth, provider);
    };

    // Cek Status Setelah Redirect
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-overlay').style.display = 'none';
            loadMessages();
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
        }
    });

    // Kirim Pesan
    document.getElementById('chat-form').onsubmit = async (e) => {
        e.preventDefault();
        const text = document.getElementById('msg-input').value;
        if (text.trim() === "" || !auth.currentUser) return;

        await addDoc(collection(db, "messages"), {
            text: text,
            uid: auth.currentUser.uid,
            displayName: auth.currentUser.displayName,
            createdAt: serverTimestamp()
        });
        document.getElementById('msg-input').value = "";
    };

    // Tampilkan Pesan
    function loadMessages() {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = `message ${data.uid === auth.currentUser.uid ? 'mine' : 'others'}`;
                div.innerHTML = `<span class="user-name">${data.displayName}</span>${data.text}`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        });
    }
</script>

</body>
</html>
