<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shoutul masteja info</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
/* Pastikan body memenuhi layar tanpa scroll luar */
body { 
    background: #000; 
    font-family: sans-serif; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
}

/* Area Chat agar fleksibel dan tidak menabrak bar input */
#chat-box { 
    flex: 1; 
    overflow-y: auto; 
    padding: 15px; 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    padding-bottom: 20px; /* Jarak aman bawah */
}

/* Container Tools (Tombol Pengumuman) */
.tools-bar { 
    background: #111; 
    padding: 8px 15px; 
    display: flex; 
    gap: 10px; 
    border-top: 1px solid #333;
}

/* Form Input agar pas di paling bawah */
#chat-form { 
    background: #1a1a1a; 
    padding: 10px; 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    padding-bottom: 20px; /* Tambahan padding untuk HP layar penuh */
}

#input-msg { 
    flex: 1; 
    background: #222; 
    border: 1px solid #FFD700; 
    color: #fff; 
    padding: 12px; 
    border-radius: 20px; 
    outline: none; 
    height: 45px; /* Tinggi standar agar muncul sejak awal */
    min-height: 45px;
    max-height: 150px; /* Biar tidak menutupi seluruh layar saat template dipakai */
    resize: none; 
}



        #login-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .peci-anim { font-size: 60px; color: #FFD700; margin-bottom: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="peci-anim"><i class="fas fa-user-tie"></i></div>
        <button style="background:#FFD700; border:none; padding:12px 30px; border-radius:25px; font-weight:bold;" onclick="mulaiLogin()">ASUP MAKE GOOGLE</button>
        <br>
        <H6>Kudu asup make akun google supaya bisa ngirim info</H6>
    </div>

    <header>
        <div class="group-icon"><i class="fas fa-crown"></i></div>
        <div class="group-info"><h4>shoutul masteja info</h4><p style="font-size:10px; color:#888;">pencet rada hebel jang hapus pesan</p></div>
    </header>

    <div id="chat-box"></div>

    <div class="tools-bar">
        <button class="btn-tool" onclick="pakaiTemplate()"><i class="fas fa-bullhorn"></i> Nyieun Pengumuman</button>
    </div>

    <form id="chat-form">
        <textarea id="input-msg" placeholder="Tulis pesan..."></textarea>
        <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyBugJ590wIKNi3r1HHnyTyl4a1YJSSPhds",
  authDomain: "shoutulmastejachat.firebaseapp.com",
  projectId: "shoutulmastejachat",
  storageBucket: "shoutulmastejachat.firebasestorage.app",
  messagingSenderId: "40109384180",
  appId: "1:40109384180:web:791ca0d9a012e3288699a1",
  measurementId: "G-QGQLC2BJBZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.mulaiLogin = () => signInWithPopup(auth, provider);

window.pakaiTemplate = () => {
    const input = document.getElementById('input-msg');
    const template = "📢 *PENGUMUMAN SHOUTUL MASTEJA*\n\n📍 Alamat: \n💼 Job: \n🏢 Tempat: \n⏰ Waktu: \n\nhayu urang gembrung! 🙏";
    input.value = template;
    input.style.height = "140px"; // Ukuran pas untuk template
    input.focus();
};



        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                muatPesan();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-msg');
            if (!input.value.trim() || !auth.currentUser) return;
            try {
                await addDoc(collection(db, "messages"), {
                    text: input.value,
                    uid: auth.currentUser.uid,
                    name: auth.currentUser.displayName,
                    time: serverTimestamp()
                });
                input.value = "";
                input.style.height = "45px";
            } catch (err) { alert(err.message); }
        };

        function muatPesan() {
            const q = query(collection(db, "messages"), orderBy("time", "asc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    const isMine = d.uid === auth.currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${isMine ? 'mine' : 'others'}`;
                    div.innerHTML = `<span style="font-size:10px; font-weight:bold; display:block; color:${isMine?'#000':'#FFD700'}">${d.name}</span>${d.text}`;
                    
                    // FITUR HAPUS PESAN (LONG PRESS)
                    let timer;
                    div.onmousedown = div.ontouchstart = () => {
                        timer = setTimeout(() => {
                            if (confirm("Hapus chat ieu?")) {
                                deleteDoc(doc(db, "messages", docSnap.id));
                            }
                        }, 1000); // Tahan 1 detik untuk hapus
                    };
                    div.onmouseup = div.onmouseleave = div.ontouchend = () => clearTimeout(timer);

                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
