<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // PASTI-KAN DATA INI SESUAI DENGAN KONFIGURASI FIREBASE ANDA
    const firebaseConfig = {// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAz1nOc9jrQHtG3lrY-A1oEOGfpGwmsK7g",
  authDomain: "shoutulmastejachat.firebaseapp.com",
  projectId: "shoutulmastejachat",
  storageBucket: "shoutulmastejachat.firebasestorage.app",
  messagingSenderId: "40109384180",
  appId: "1:40109384180:web:791ca0d9a012e3288699a1",
  measurementId: "G-QGQLC2BJBZ"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();
    const provider = new GoogleAuthProvider();

    // FUNGSI LOGIN DENGAN REDIRECT (Lebih Aman untuk HP)
    window.loginGoogle = () => {
        signInWithRedirect(auth, provider);
    };

    // CEK HASIL REDIRECT SAAT HALAMAN TERMUAT KEMBALI
    getRedirectResult(auth).catch((error) => {
        console.error("Gagal Login:", error.message);
    });

    // PANTAU STATUS LOGIN
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-overlay').style.display = 'none';
            loadMessages(user.uid);
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
        }
    });

    // FUNGSI KIRIM PESAN
    const chatForm = document.getElementById('chat-form');
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = document.getElementById('msg-input').value;
        if (text.trim() === "" || !auth.currentUser) return;

        await addDoc(collection(db, "messages"), {
            text: text,
            uid: auth.currentUser.uid,
            displayName: auth.currentUser.displayName,
            createdAt: serverTimestamp()
        });
        document.getElementById('msg-input').value = "";
    });

    // FUNGSI TAMPILKAN PESAN
    function loadMessages(currentUid) {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = `message ${data.uid === currentUid ? 'mine' : 'others'}`;
                div.innerHTML = `<span class="user-name">${data.displayName || 'Anonim'}</span>${data.text}`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        });
    }
</script>
