<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Obrolan - Shoutul Masteja</title>
    <style>
        :root { --primary: #FFD700; --bg-dark: #0a0a0a; --card-bg: #161616; }
        body { background: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; }
        
        /* Header */
        nav { background: #000; padding: 15px; border-bottom: 2px solid var(--primary); text-align: center; }
        
        /* Area Chat */
        #chat-container { height: 70vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .mine { align-self: flex-end; background: #3d3d00; border: 1px solid var(--primary); }
        .others { align-self: flex-start; background: #222; }
        .user-name { font-size: 0.7rem; color: var(--primary); margin-bottom: 5px; display: block; }

        /* Input Area */
        .input-area { padding: 20px; background: #111; display: flex; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #222; color: white; outline: none; }
        button { background: var(--primary); border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Login Overlay */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2>Selamat Datang di Ruang Obrolan</h2>
        <p>Silakan masuk untuk mulai berdiskusi</p>
        <button onclick="loginGoogle()">Masuk dengan Google</button>
    </div>

    <nav>
        <h1 style="color: var(--primary); font-size: 1.2rem;">MAJELIS CHAT</h1>
    </nav>

    <div id="chat-container">
        </div>

    <form class="input-area" id="chat-form">
        <input type="text" id="msg-input" placeholder="Tulis pesan..." autocomplete="off">
        <button type="submit">Kirim</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // GANTI DENGAN KONFIGURASI FIREBASE ANDA SENDIRI
        const firebaseConfig = {
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAz1nOc9jrQHtG3lrY-A1oEOGfpGwmsK7g",
  authDomain: "shoutulmastejachat.firebaseapp.com",
  projectId: "shoutulmastejachat",
  storageBucket: "shoutulmastejachat.firebasestorage.app",
  messagingSenderId: "40109384180",
  appId: "1:40109384180:web:791ca0d9a012e3288699a1",
  measurementId: "G-QGQLC2BJBZ"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();
        const provider = new GoogleAuthProvider();

        // Fungsi Login
        window.loginGoogle = () => {
            signInWithPopup(auth, provider).catch(error => console.error(error));
        };

        // Cek Status Login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').style.display = 'none';
                loadMessages(user.uid);
            }
        });

        // Kirim Pesan
        const chatForm = document.getElementById('chat-form');
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('msg-input').value;
            if (text.trim() === "") return;

            await addDoc(collection(db, "messages"), {
                text: text,
                uid: auth.currentUser.uid,
                displayName: auth.currentUser.displayName,
                createdAt: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        });

        // Tampilkan Pesan secara Real-time
        function loadMessages(currentUid) {
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('chat-container');
                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = `message ${data.uid === currentUid ? 'mine' : 'others'}`;
                    div.innerHTML = `<span class="user-name">${data.displayName}</span>${data.text}`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }
    </script>
</body>
</html>
