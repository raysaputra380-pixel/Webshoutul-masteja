<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>shoutul masteja info</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS RESET & CORE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #000; 
            font-family: sans-serif; 
            height: 100vh; /* Kunci tinggi tepat 100% layar */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Mencegah seluruh halaman geser */
        }

        /* HEADER Tetap di Atas */
        header { 
            background: #1a1a1a; 
            padding: 12px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border-bottom: 2px solid #FFD700;
            flex-shrink: 0; /* Jangan biarkan header mengecil */
        }
        .group-icon { width: 35px; height: 35px; background: #FFD700; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; }

        /* AREA CHAT - Hanya ini yang bisa di-scroll */
        #chat-box { 
            flex: 1; /* Mengambil semua sisa ruang tengah */
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            background: #000;
            -webkit-overflow-scrolling: touch; /* Scroll halus di iPhone/Chrome */
        }

        /* Gaya Gelembung Pesan */
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .mine { align-self: flex-end; background: #FFD700; color: #000; border-bottom-right-radius: 2px; }
        .others { align-self: flex-start; background: #1a1a1a; color: #FFD700; border: 1px solid #FFD700; border-bottom-left-radius: 2px; }

        /* AREA TOOLS (Tombol Pengumuman) */
        .tools-bar { 
            background: #111; 
            padding: 8px 15px; 
            border-top: 1px solid #333;
            flex-shrink: 0;
        }
        .btn-tool {
            background: #222;
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* FORM INPUT - Tetap di Paling Bawah */
        #chat-form { 
            background: #1a1a1a; 
            padding: 8px 12px 25px 12px; /* Padding bawah extra untuk navigasi HP */
            display: flex; 
            align-items: flex-end; 
            gap: 8px; 
            border-top: 1px solid #333;
            flex-shrink: 0;
        }

        #input-msg { 
            flex: 1; 
            background: #222; 
            border: 1px solid #FFD700; 
            color: #fff; 
            padding: 10px 15px; 
            border-radius: 20px; 
            outline: none; 
            height: 42px; 
            min-height: 42px;
            max-height: 120px; 
            resize: none;
            font-size: 14px;
        }

        .btn-send { 
            background: #FFD700; 
            color: #000; 
            border: none; 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* Overlay Login */
        #login-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        .peci-anim { font-size: 50px; color: #FFD700; margin-bottom: 15px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="peci-anim"><i class="fas fa-user-tie"></i></div>
        <button style="background:#FFD700; border:none; padding:12px 30px; border-radius:25px; font-weight:bold;" onclick="mulaiLogin()">ASUP MAKE GOOGLE</button>
        <h6 style="margin-top: 15px; color: #666; padding: 0 20px;">Kudu asup make akun google supaya bisa ngirim info</h6>
    </div>

    <header>
        <div class="group-icon"><i class="fas fa-crown"></i></div>
        <div class="group-info">
            <h4 style="color: #FFD700; font-size: 15px;">shoutul masteja info</h4>
            <p style="font-size:9px; color:#888;">pencet rada hebel jang hapus pesan</p>
        </div>
    </header>

    <div id="chat-box"></div>

    <div class="tools-bar">
        <button class="btn-tool" onclick="pakaiTemplate()"><i class="fas fa-bullhorn"></i> Nyieun Pengumuman</button>
    </div>

    <form id="chat-form">
        <textarea id="input-msg" placeholder="Tulis pesan..."></textarea>
        <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
    </form>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBugJ590wIKNi3r1HHnyTyl4a1YJSSPhds",
            authDomain: "shoutulmastejachat.firebaseapp.com",
            projectId: "shoutulmastejachat",
            storageBucket: "shoutulmastejachat.firebasestorage.app",
            messagingSenderId: "40109384180",
            appId: "1:40109384180:web:791ca0d9a012e3288699a1",
            measurementId: "G-QGQLC2BJBZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.mulaiLogin = () => signInWithPopup(auth, provider);

        window.pakaiTemplate = () => {
            const input = document.getElementById('input-msg');
            input.value = "📢 *PENGUMUMAN SHOUTUL MASTEJA*\n\n📍 Alamat: \n💼 Job: \n🏢 Tempat: \n⏰ Waktu: \n\nhayu urang gembrung! 🙏";
            input.style.height = "140px"; 
            input.focus();
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                muatPesan();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-msg');
            if (!input.value.trim() || !auth.currentUser) return;
            try {
                await addDoc(collection(db, "messages"), {
                    text: input.value,
                    uid: auth.currentUser.uid,
                    name: auth.currentUser.displayName,
                    time: serverTimestamp()
                });
                input.value = "";
                input.style.height = "45px";
            } catch (err) { alert(err.message); }
        };

        function muatPesan() {
            const q = query(collection(db, "messages"), orderBy("time", "asc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    const isMine = d.uid === auth.currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${isMine ? 'mine' : 'others'}`;
                    div.innerHTML = `<span style="font-size:10px; font-weight:bold; display:block; margin-bottom:4px; color:${isMine?'#000':'#FFD700'}">${d.name}</span>${d.text}`;
                    
                    let timer;
                    div.ontouchstart = () => {
                        timer = setTimeout(() => {
                            if (confirm("Hapus chat ieu?")) {
                                deleteDoc(doc(db, "messages", docSnap.id));
                            }
                        }, 800);
                    };
                    div.ontouchend = () => clearTimeout(timer);

                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
