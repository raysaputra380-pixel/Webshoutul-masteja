<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Shoutul Masteja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: #FFD700; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; text-align: center; border-bottom: 2px solid #FFD700; background: #1a1a1a; font-weight: bold; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #121212; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 85%; font-size: 14px; position: relative; }
        .mine { align-self: flex-end; background: #FFD700; color: #000; border-bottom-right-radius: 2px; }
        .others { align-self: flex-start; background: #2c2c2c; color: #fff; border: 1px solid #FFD700; border-bottom-left-radius: 2px; }
        .user-name { display: block; font-size: 10px; margin-bottom: 3px; font-weight: bold; opacity: 0.7; }

        #login-screen { position: fixed; inset: 0; background: rgba(18,18,18,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99; }
        .btn-gold { background: #FFD700; color: #000; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        
        #chat-form { padding: 10px; background: #1a1a1a; display: flex; gap: 8px; border-top: 1px solid #333; }
        #input-msg { flex: 1; background: #222; border: 1px solid #FFD700; color: white; padding: 10px; border-radius: 20px; outline: none; }
        
        #error-log { color: #ff4444; font-size: 12px; margin-top: 15px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

    <header><i class="fas fa-comments"></i> SHOUTUL MASTEJA CHAT</header>

    <div id="login-screen">
        <i class="fas fa-user-shield" style="font-size: 50px; margin-bottom: 15px;"></i>
        <p>Gunakan akun Google untuk bergabung</p>
        <button class="btn-gold" onclick="mulaiLogin()">
            <i class="fab fa-google"></i> Masuk dengan Google
        </button>
        <div id="error-log"></div>
    </div>

    <div id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="input-msg" placeholder="Tulis pesan..." autocomplete="off">
        <button type="submit" class="btn-gold" style="padding: 10px 15px;"><i class="fas fa-paper-plane"></i></button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBugJ590wIKNi3r1HHnyTyl4a1YJSSPhds",
  authDomain: "shoutulmastejachat.firebaseapp.com",
  projectId: "shoutulmastejachat",
  storageBucket: "shoutulmastejachat.firebasestorage.app",
  messagingSenderId: "40109384180",
  appId: "1:40109384180:web:791ca0d9a012e3288699a1",
  measurementId: "G-QGQLC2BJBZ"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Fungsi Login
        window.mulaiLogin = () => {
            const errorDiv = document.getElementById('error-log');
            errorDiv.innerText = "Membuka jendela Google...";
            
            signInWithPopup(auth, provider)
                .then(() => errorDiv.innerText = "")
                .catch((error) => {
                    console.error(error);
                    errorDiv.innerText = "Gagal Login: " + error.message;
                });
        };

        // Pantau Status Login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                muatPesan();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        // Kirim Pesan
        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-msg');
            if (!input.value.trim() || !auth.currentUser) return;

            try {
                await addDoc(collection(db, "chats"), {
                    text: input.value,
                    uid: auth.currentUser.uid,
                    name: auth.currentUser.displayName,
                    time: serverTimestamp()
                });
                input.value = "";
            } catch (err) {
                alert("Gagal kirim: " + err.message);
            }
        };

        // Muat Pesan Realtime
        function muatPesan() {
            const q = query(collection(db, "chats"), orderBy("time", "asc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = "";
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    const isMine = d.uid === auth.currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${isMine ? 'mine' : 'others'}`;
                    div.innerHTML = `<span class="user-name">${d.name}</span> ${d.text}`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
